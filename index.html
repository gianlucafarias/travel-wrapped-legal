<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Wrapped</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #14161f; --muted: #5b6070; --line: #e3e5ee; --accent: #2447e0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0f16; --fg: #f2f3f8; --muted: #a2a7b8; --line: #252a3a; --accent: #8da2ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; }
  h2 { font-size: 21px; margin: 40px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
  p, li { color: var(--fg); }
  .muted { color: var(--muted); }
  ul { padding-left: 22px; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Travel Wrapped</h1>
  <p class="muted">Tu año en viajes, a partir de las fotos de tu iPhone.</p>
  <ul>
    <li><a href="privacy.html">Política de privacidad</a></li>
    <li><a href="support.html">Soporte</a></li>
  </ul>
</main>
</body>
</html>
